name: Weekly Static Messages

on:
  schedule:
    # 15:00 Asia/Shanghai = 07:00 UTC.
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    env:
      LOG_LEVEL: INFO
      DISCORD_WEBHOOK_URL_NTE: ${{ secrets.DISCORD_WEBHOOK_URL_NTE }}
      DISCORD_WEBHOOK_URL_HSR: ${{ secrets.DISCORD_WEBHOOK_URL_HSR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Send weekly static messages
        run: python -m src.weekly_static_messages
